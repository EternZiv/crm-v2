{% load static i18n %}
<div class="p-5 relative bg-white rounded-lg shadow-sm w-fit min-w-full">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-md font-semibold">{% trans "Qualify Lead" %}</h2>
        <button type="button" onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-xl cursor-pointer">
            <img src="{% static 'assets/icons/close.svg' %}" alt="{% trans 'Close' %}">
        </button>
    </div>

    <form
        hx-post="{% url 'leads:qualify_lead' lead.pk %}"
        hx-target="#modalBox"
        hx-swap="innerHTML"
    >
        {% csrf_token %}

        <div class="mb-4 p-3 bg-gray-50 border border-gray-200 rounded-lg text-xs space-y-1">
            <div class="font-semibold text-gray-800 text-sm">{{ lead.first_name }} {{ lead.last_name }}</div>
            <div class="text-gray-600">{{ lead.lead_company }}</div>
            <div class="text-gray-500">{{ lead.email }} | {{ lead.contact_number|default:"No phone" }}</div>
        </div>

        <div class="mb-4">
            <label class="block text-xs font-medium text-gray-700 mb-1">{% trans "Customer Interest / Solution Needed" %}</label>
            <textarea
                name="customer_interest"
                rows="3"
                class="w-full text-sm p-2 border border-dark-50 rounded-md focus:border-primary-600 focus-visible:outline-0"
                placeholder="{% trans 'Describe customer interest and buying intent...' %}"
            >{{ lead.customer_interest|default:'' }}</textarea>
        </div>

        <div class="mb-4">
            <label class="block text-xs font-medium text-gray-700 mb-1">{% trans "Basic Requirements" %}</label>
            <textarea
                name="requirements"
                rows="3"
                class="w-full text-sm p-2 border border-dark-50 rounded-md focus:border-primary-600 focus-visible:outline-0"
                placeholder="{% trans 'Key software, hardware, or operational requirements...' %}"
            >{{ lead.requirements|default:'' }}</textarea>
        </div>

        <div class="flex justify-end gap-3 mt-6">
            <button
                type="button"
                onclick="closeModal()"
                class="px-4 py-2 text-sm border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50"
            >
                {% trans "Cancel" %}
            </button>
            <button
                type="submit"
                class="px-4 py-2 text-sm bg-primary-600 text-white rounded-md hover:bg-primary-700 transition"
            >
                {% trans "Mark as Qualified" %}
            </button>
        </div>
    </form>
</div>
