{% extends "error.html" %}
{% block content %}
    <div class="max-w-md mx-auto my-12 text-center p-8 bg-white dark:bg-[#1f2937] rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">{% trans "Permission Denied" %}</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">
            {% if message %}{{ message }}{% else %}{% trans "You do not have permission to view this page." %}{% endif %}
        </p>
        <a
            href="/"
            class="inline-block text-sm font-medium px-5 py-2.5 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition"
        >
            {% trans "Go to Dashboard" %}
        </a>
    </div>
{% endblock %}
