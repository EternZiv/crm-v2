<div id="mobileSidebarBackdrop" class="fixed inset-0 bg-black/50 z-35 hidden transition-opacity duration-300"></div>
<div id="primarySidebar" class="fixed inset-y-0 {% if LANGUAGE_BIDI %}right-0 border-l border-l-primary-100{% else %}left-0 border-r border-r-primary-100{% endif %} w-[5rem] bg-white z-40">
    <div class="p-4">
        <div class="flex items-center justify-between gap-2 mb-8">
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-primary-600 text-white font-bold text-lg mx-auto select-none">F</span>
            <button
                type="button"
                id="closeMobileSidebar"
                class="mobile-close-btn text-dark-300 hover:text-dark-600 p-1 rounded-md"
                title="{% trans 'Close menu' %}"
                aria-label="{% trans 'Close menu' %}"
            >
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <nav class="relative space-y-2">
            {% for item in main_section_menu %}
                {% has_section_perm_url request.user item.section as perm_url %}
                {% if perm_url %}
                    <a
                        href="{{ item.url|default:perm_url }}?section={{ item.section }}"
                        class="nav-link"
                        id="{{ item.section }}"
                        title="{{ item.name }}"
                        aria-label="{{ item.name }}"
                        data-tooltip-placement="{% if LANGUAGE_BIDI %}left{% else %}right{% endif %}"
                        {% for attr, value in item.attrs.items %}
                            {{ attr }}="{{ value }}"
                        {% endfor %}
                    >
                        <span
                            class="nav-link-icon w-5 h-5"
                            style="--icon-url: url('{% static item.icon %}')"
                        ></span>
                        <span class="nav-link-label">{{ item.name }}</span>
                    </a>
                {% endif %}
            {% endfor %}
        </nav>
    </div>
    {% if floating_menu %}
        <div class="floating-menu bg-primary-600">
            <input
                type="checkbox"
                name="floating-menu"
                title="{% trans 'Quick actions' %}"
                aria-label="{% trans 'Quick actions' %}"
                data-tooltip-placement="{% if LANGUAGE_BIDI %}left{% else %}right{% endif %}"
                onkeydown="if (event.key === 'Enter') { this.checked = !this.checked; }"
            >
            <span class="plus-icon bg-primary-600">
                <span class="fa fa-plus" aria-hidden="true"></span>
            </span>
            <ul class="floating-nav">
                {% for menu in floating_menu %}
                    <li class="bg-primary-600">
                        <button
                            type="button"
                            hx-get="{{ menu.url }}{% if request.GET.urlencode %}{% if '?' in menu.url %}&{% else %}?{% endif %}{{ request.GET.urlencode }}{% endif %}"
                            hx-trigger="click, keyup[key=='Enter']"
                            {% for key, value in menu.items.items %}
                                {{ key }}="{{ value }}"
                            {% endfor %}
                            class="w-full h-full flex items-center justify-center rounded-full text-white cursor-pointer bg-transparent border-0 p-0"
                            title="{{ menu.title }}"
                            aria-label="{{ menu.title }}"
                            data-tooltip-placement="{% if LANGUAGE_BIDI %}left{% else %}right{% endif %}"
                        >
                            <img src="{% static menu.icon %}" alt="" width="17" class="w-4 h-4 brightness-0 invert">
                        </button>
                    </li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
</div>
