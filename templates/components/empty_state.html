<div class="empty-state flex flex-col items-center justify-center py-8{% if wrapper_class %} {{ wrapper_class }}{% endif %}">
    {% if spacer %}
        <div class="flex justify-between items-center h-20"></div>
    {% endif %}
    {% if message %}
        <p class="text-sm text-center mb-3 text-slate-500">{{ message }}</p>
    {% endif %}
    {% if action_url %}
        <div class="flex justify-center">
            <a
                href="{{ action_url }}"
                class="text-sm px-4 py-2 bg-primary-600 rounded-md hover:bg-primary-800 transition duration-300 text-white"
            >
                {{ action_label }}
            </a>
        </div>
    {% endif %}
</div>
