<script>
    (function () {
        var saved = localStorage.getItem("sidebarCollapsed");
        if (saved === "true") {
            document.documentElement.setAttribute("data-sidebar-collapsed", "true");
        } else {
            document.documentElement.removeAttribute("data-sidebar-collapsed");
        }
    })();
</script>
<style>
    html[data-sidebar-collapsed='true'] #sideMenu {
        width: 0 !important;
        transition: none !important;
    }
    html[data-sidebar-collapsed='true'] #mainContent {
        padding-inline-start: 0 !important;
    }
    html[data-sidebar-collapsed='true'] #arrowIcon {
        transform: scaleX(-1) !important;
    }
    html[data-sidebar-collapsed='true'] #toggleSideMenu {
        inset-inline-start: calc(5rem - 10px) !important;
    }
</style>
{% with current_items=sub_section_menu|get_item:current_section %}
    <div class="relative h-full{% if not current_items %} hidden{% endif %}" id="sideMenuContainer">
        {% if current_items %}
            <button
                type="button"
                id="toggleSideMenu"
                class="fixed top-[3.9375rem] {% if LANGUAGE_BIDI %}right-[calc(5rem+230px-10px)]{% else %}left-[calc(5rem+230px-10px)]{% endif %} w-[20px] z-40 focus-visible:outline-0 cursor-pointer"
            >
                <i
                    id="arrowIcon"
                    class="fa-solid {% if LANGUAGE_BIDI %}fa-chevron-right{% else %}fa-chevron-left{% endif %} leading-none"
                    aria-hidden="true"
                    style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background-color: var(--menu-arrow-bg); color: var(--menu-arrow-fg); font-size: 10px; line-height: 1; -webkit-text-stroke: 0.9px currentColor; paint-order: stroke fill"
                ></i>
            </button>
            <div
                id="sideMenu"
                class="w-[230px] fixed {% if LANGUAGE_BIDI %}right-[5rem] border-l border-l-primary-100{% else %}left-[5rem] border-r border-r-primary-100{% endif %} bg-white overflow-hidden h-[calc(100vh-60px)] z-30"
            >
                <ul class="flex flex-col gap-[5px] p-5 pt-8" id="subSidebar" hx-swap-oob="true">
                    {% for item in current_items %}
                        {% if not item.perm or request.user|has_super_user:item.perm %}
                            <li class="subSidebarItem">
                                <a
                                    id="{{ item.id }}"
                                    href="{{ item.url }}?section={{ current_section }}"
                                    data-section="{{ current_section }}"
                                    {% if item.attrs %}
                                        {% for attr, value in item.attrs.items %}
                                            {{ attr }}="{{ value }}"
                                        {% endfor %}
                                    {% else %}
                                        hx-boost="true"
                                        hx-target="#mainContent"
                                        hx-select="#mainContent"
                                        hx-swap="outerHTML"
                                        hx-push-url="true"
                                    {% endif %}
                                    class="sidebar-link group flex items-center gap-3 text-sm px-3 py-2 rounded-md"
                                >
                                    {% if item.icon %}
                                        <span
                                            class="sidebar-link-icon"
                                            style="--icon-url: url('{% static item.icon %}')"
                                        ></span>
                                    {% endif %}
                                    {{ item.label }}
                                </a>
                            </li>
                        {% endif %}
                    {% endfor %}
                </ul>
            </div>
        {% endif %}
    </div>
{% endwith %}
