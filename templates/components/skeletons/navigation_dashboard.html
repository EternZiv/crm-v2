<section class="finlo-skeleton finlo-destination-shell p-4 md:p-6" data-finlo-navigation-shell="dashboard" role="status" aria-live="polite" aria-label="Loading destination page">
    <div class="mb-5 flex items-center justify-between border-b border-slate-100 pb-4">
        <div class="h-7 w-44 rounded bg-slate-200"></div>
        <div class="h-9 w-36 rounded-lg bg-slate-100"></div>
    </div>
    <div class="mb-5 grid grid-cols-2 gap-3 lg:grid-cols-4">
        {% for _ in "1234" %}
            <div class="rounded-xl border border-slate-100 bg-white p-4">
                <div class="mb-4 h-4 w-24 rounded bg-slate-100"></div>
                <div class="h-8 w-20 rounded bg-slate-200"></div>
            </div>
        {% endfor %}
    </div>
    <div class="grid grid-cols-1 gap-4 xl:grid-cols-2">
        {% for _ in "12" %}
            <div class="min-h-[280px] rounded-xl border border-slate-100 bg-white p-5">
                <div class="mb-6 h-5 w-36 rounded bg-slate-200"></div>
                <div class="h-[210px] rounded-lg bg-slate-50"></div>
            </div>
        {% endfor %}
    </div>
</section>
