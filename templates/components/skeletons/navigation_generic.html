<section class="finlo-skeleton finlo-destination-shell p-4 md:p-6" data-finlo-navigation-shell="generic" role="status" aria-live="polite" aria-label="Loading destination page">
    <div class="mb-5 flex items-center justify-between border-b border-slate-100 pb-4">
        <div class="h-7 w-40 rounded bg-slate-200"></div>
        <div class="h-9 w-24 rounded-lg bg-slate-100"></div>
    </div>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
        {% for _ in "123" %}
            <div class="min-h-28 rounded-xl border border-slate-100 bg-white p-5">
                <div class="mb-4 h-5 w-32 rounded bg-slate-200"></div>
                <div class="h-4 w-full rounded bg-slate-100"></div>
            </div>
        {% endfor %}
    </div>
    <div class="mt-5 min-h-56 rounded-xl border border-slate-100 bg-white p-5">
        <div class="mb-5 h-5 w-40 rounded bg-slate-200"></div>
        {% for _ in "1234" %}<div class="mb-4 h-4 rounded bg-slate-100 last:mb-0"></div>{% endfor %}
    </div>
</section>
