<div class="finlo-skeleton w-full animate-pulse space-y-4 p-4 bg-white rounded-xl shadow-sm border border-gray-100" id="finlo-skeleton-loader">
    <div class="flex items-center justify-between pb-3 border-b border-gray-100">
        <div class="flex items-center space-x-3">
            <div class="h-8 w-48 bg-gray-200 rounded-md"></div>
            <div class="h-8 w-24 bg-gray-100 rounded-md"></div>
        </div>
        <div class="flex items-center space-x-2">
            <div class="h-8 w-8 bg-gray-100 rounded-md"></div>
            <div class="h-8 w-8 bg-gray-100 rounded-md"></div>
            <div class="h-8 w-28 bg-gray-200 rounded-md"></div>
        </div>
    </div>
    <div class="grid grid-cols-6 gap-4 py-2 border-b border-gray-100 bg-gray-50/50 rounded px-2">
        <div class="h-4 bg-gray-200 rounded col-span-1"></div>
        <div class="h-4 bg-gray-200 rounded col-span-1"></div>
        <div class="h-4 bg-gray-200 rounded col-span-1"></div>
        <div class="h-4 bg-gray-200 rounded col-span-1"></div>
        <div class="h-4 bg-gray-200 rounded col-span-1"></div>
        <div class="h-4 bg-gray-200 rounded col-span-1"></div>
    </div>
    {% for _ in "12345678" %}
    <div class="grid grid-cols-6 gap-4 py-3 border-b border-gray-50 items-center px-2">
        <div class="h-4 bg-gray-100 rounded col-span-1 w-3/4"></div>
        <div class="h-4 bg-gray-100 rounded col-span-1 w-5/6"></div>
        <div class="h-4 bg-gray-100 rounded col-span-1 w-2/3"></div>
        <div class="h-4 bg-gray-100 rounded col-span-1 w-1/2"></div>
        <div class="h-4 bg-gray-100 rounded col-span-1 w-4/5"></div>
        <div class="h-4 bg-gray-100 rounded col-span-1 w-1/3"></div>
    </div>
    {% endfor %}
</div>
