<section class="finlo-skeleton finlo-destination-shell p-4 md:p-6" data-finlo-navigation-shell="list" role="status" aria-live="polite" aria-label="Loading destination page">
    <div class="flex items-center justify-between gap-4 border-b border-slate-100 pb-4">
        <div class="h-7 w-40 rounded bg-slate-200"></div>
        <div class="flex items-center gap-2">
            <div class="h-9 w-48 rounded-lg bg-slate-100"></div>
            <div class="h-9 w-9 rounded-lg bg-slate-100"></div>
            <div class="h-9 w-20 rounded-lg bg-slate-200"></div>
        </div>
    </div>
    <div class="mt-5 overflow-hidden rounded-xl border border-slate-100 bg-white">
        <div class="grid grid-cols-6 gap-4 border-b border-slate-100 bg-slate-50 p-4">
            {% for _ in "123456" %}<div class="h-4 rounded bg-slate-200"></div>{% endfor %}
        </div>
        {% for _ in "12345678" %}
            <div class="grid grid-cols-6 items-center gap-4 border-b border-slate-50 p-4 last:border-0">
                {% for _ in "123456" %}<div class="h-4 rounded bg-slate-100"></div>{% endfor %}
            </div>
        {% endfor %}
    </div>
</section>
