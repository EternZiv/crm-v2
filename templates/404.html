{% extends "error.html" %}
{% block content %}
    <div class="max-w-md mx-auto my-12 text-center p-8 bg-white dark:bg-[#1f2937] rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 mb-4">
            <span class="text-2xl font-extrabold">404</span>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">{% trans "Page Not Found" %}</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">
            {{ error_message|default:"The requested page or resource could not be found." }}
        </p>
        <a
            href="/"
            class="inline-block text-sm font-medium px-5 py-2.5 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition"
        >
            {% trans "Go to Dashboard" %}
        </a>
    </div>
{% endblock %}
