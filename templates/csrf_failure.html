{% extends "error.html" %}
{% block content %}
    <div class="max-w-md mx-auto my-12 text-center p-8 bg-white dark:bg-[#1f2937] rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">{% trans "Security Verification" %}</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">
            {% if message %}{{ message }}{% else %}
                {% trans "We could not verify this session. Please refresh the page and submit again." %}
            {% endif %}
        </p>
        <a
            href="/"
            class="inline-block text-sm font-medium px-5 py-2.5 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition"
        >
            {% trans "Go to Dashboard" %}
        </a>
    </div>
{% endblock %}
